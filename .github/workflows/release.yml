name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # Guard the manual trigger: on workflow_dispatch from a branch, GITHUB_REF_NAME
    # is the branch name, and `gh release create` would tag the branch.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
      # attest-build-provenance signs with a short-lived OIDC token and records
      # the result in the repository's attestation store. Neither is a secret
      # this repository holds.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # winresource stamps CARGO_PKG_VERSION into the executable's Windows file
      # properties, so a tag that disagrees with Cargo.toml would attach a
      # binary that reports a different version than the release it ships under.
      - name: Verify the manifest matches the tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -n 1)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Cargo.toml is $manifest, but the tag is v$tag" >&2
            exit 1
          fi
          echo "Releasing $manifest"

      # --locked everywhere: a published binary must be built from exactly the
      # dependency versions in the committed Cargo.lock.
      - name: Verify the release build passes every gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build
        run: cargo build --locked --release

      # v1.0.1's notes were written by hand after the fact, because the workflow
      # generated only the hash and the unsigned-binary warning. The reason to
      # upgrade is the one thing a release page has to carry, and it is known
      # when the change is made, not when the tag is pushed. An absent section
      # fails here, while the tag is still re-runnable.
      - name: Take the release notes from the changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v want="$version" '
            $0 ~ ("^## \\[" want "\\]") { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "" >> notes.md
          cat notes.md

      # The binary is unsigned, so publish the hash rather than asking for
      # trust. It is no longer the only check available -- see the attestation
      # below -- but it is the one that needs no tooling.
      - name: Record SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash target\release\ProcDrift.exe -Algorithm SHA256).Hash
          "SHA-256: ``$hash``" | Out-File -FilePath notes.md -Append -Encoding utf8
          "" | Out-File -FilePath notes.md -Append -Encoding utf8
          "This binary is unsigned. SmartScreen will warn on first run until the build earns reputation." | Out-File -FilePath notes.md -Append -Encoding utf8
          "" | Out-File -FilePath notes.md -Append -Encoding utf8
          "Verify what produced it with ``gh attestation verify ProcDrift.exe --repo $env:GITHUB_REPOSITORY``." | Out-File -FilePath notes.md -Append -Encoding utf8
          Write-Output "ProcDrift.exe $hash"

      # The published hash says the file has not changed since it was hashed.
      # It cannot say what produced it, because the same workflow computes and
      # publishes it. The attestation binds this binary to this workflow, this
      # commit, and this repository, and is checked with `gh attestation verify`
      # against a store the release page cannot rewrite. That matters more here
      # than usual: the binary is unsigned, so a downloader has nothing else.
      #
      # Deliberately before the release exists. A failure here leaves the tag
      # re-runnable rather than leaving an unattested asset published.
      - name: Attest the binary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release/ProcDrift.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --title $env:GITHUB_REF_NAME `
            --notes-file notes.md `
            target\release\ProcDrift.exe
