name: Bug report
description: Something behaved differently than documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a misclassified process, the finding shown and the executable path
        are worth more than a screenshot of the whole window.

        **Redact before you paste.** Process lists and executable paths contain
        your username, installed software, and sometimes document names.
        `C:\Users\<you>\...` is fine.

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you expected, and what ProcDrift showed instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: >
        What you clicked, and what state the snapshot was in — freshly
        recorded, or captured some time ago.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ProcDrift version
      description: >-
        The line reported by `ProcDrift --version`, which is also the window
        title. If you built it yourself, the commit SHA instead.
      placeholder: "ProcDrift 1.2.3"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows build
      description: The full line from `winver`.
      placeholder: "Windows 11 Pro 24H2 (build 26100.2314)"
    validations:
      required: true

  - type: dropdown
    id: elevated
    attributes:
      label: Was ProcDrift running elevated?
      description: >
        Unelevated, some processes are not readable at all, which changes what
        a scan can see.
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: The affected row
      description: >
        For a misclassification: the executable path, the trust shown, the
        findings listed, and the signature result from the details pane.
      render: text

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I removed my username and any personal paths from anything I pasted.
          required: true
        - label: This is not a security vulnerability. (Those go through the private advisory form linked on the new-issue page.)
          required: true
